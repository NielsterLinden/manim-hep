name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not render" -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, package and plugin versions must match
        run: |
          python - <<'PY'
          import json, os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pkg = re.search(r'__version__ = "(.+?)"', open("src/manim_hep/__init__.py").read()).group(1)
          plugin = json.load(open("plugin/.claude-plugin/plugin.json"))["version"]
          print(f"tag={tag} package={pkg} plugin={plugin}")
          sys.exit(0 if tag == pkg == plugin else 1)
          PY
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Zenodo mints a DOI for every GitHub release once the repository is enabled there.
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
