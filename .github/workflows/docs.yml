name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "gallery/**", "mkdocs.yml", "*.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "src/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config \
            texlive texlive-latex-extra dvisvgm
      - run: python -m pip install -e ".[dev]"
      - name: Render gallery previews
        if: github.event_name != 'pull_request'
        run: |
          python scripts/gallery_tool.py render
          python scripts/gallery_tool.py previews
      - run: python scripts/gallery_tool.py pages
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
