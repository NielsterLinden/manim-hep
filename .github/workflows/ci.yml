name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests gallery scripts
      - run: ruff format --check src tests gallery scripts

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config
      - run: python -m pip install -e ".[dev]"
      # Includes the version-sync, plugin and gallery-structure checks.
      - run: python -m pytest -m "not render" -q

  render:
    name: render and LaTeX tests (Linux, TeX Live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config \
            texlive texlive-latex-extra dvisvgm
      - run: python -m pip install -e ".[dev]"
      - run: manim-hep doctor
      - run: python -m pytest -m "render or latex" -q
